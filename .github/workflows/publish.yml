name: Publish

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write

  publish:
    needs: osv-scan
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Verify release tag and changelog
        run: |
          package_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          grep -Eq "^## $package_version - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
      - name: Verify this commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh run list --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId --jq length)" -gt 0
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/check_coverage.dart coverage/lcov.info 40
      - run: dart pub publish --dry-run
      - name: Publish verified package
        run: dart pub publish --force
